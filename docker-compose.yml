services:
  meshcore-openwebui-bridge:
    build: .
    container_name: meshcore-openwebui-bridge
    restart: unless-stopped

    devices:
      - "${MESHCORE_SERIAL:-/dev/ttyACM0}:${MESHCORE_SERIAL:-/dev/ttyACM0}"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env

    volumes:
      - meshcore-bridge-data:/data

    security_opt:
      - no-new-privileges:true

volumes:
  meshcore-bridge-data:
